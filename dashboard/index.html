<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Starter</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1 class="brand">Ops Dashboard</h1>
        <nav>
          <button class="nav-item active" data-view="overview">Overview</button>
          <button class="nav-item" data-view="performance">Performance</button>
          <button class="nav-item" data-view="customers">Customers</button>
        </nav>
      </aside>

      <main class="main">
        <header class="toolbar">
          <div>
            <h2 id="title">Overview</h2>
            <p id="subtitle">Live view of your product health.</p>
          </div>
          <div class="controls">
            <label>
              Time range
              <select id="range">
                <option value="7">Last 7 days</option>
                <option value="14">Last 14 days</option>
                <option value="30" selected>Last 30 days</option>
              </select>
            </label>
          </div>
        </header>

        <section class="kpis" id="kpis"></section>

        <section class="panel">
          <div class="panel-head">
            <h3>Traffic trend</h3>
            <span class="hint">Daily sessions</span>
          </div>
          <canvas id="trendChart" width="980" height="260" aria-label="Traffic trend chart"></canvas>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h3>Recent activity</h3>
            <span class="hint" id="rowsInfo"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Channel</th>
                  <th>Sessions</th>
                  <th>Conversion</th>
                  <th>Revenue</th>
                </tr>
              </thead>
              <tbody id="activityRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
