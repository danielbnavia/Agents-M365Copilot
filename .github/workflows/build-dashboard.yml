name: Build dashboard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - ".github/workflows/build-dashboard.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - ".github/workflows/build-dashboard.yml"

permissions:
  contents: read

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run lint
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
